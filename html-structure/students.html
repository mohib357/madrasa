<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমাদের ছাত্র-ছাত্রীবৃন্দ</title>
    <link rel="stylesheet" href="../css/student-card.css">
    <link href="https://fonts.maateen.me/hind-siliguri/font.css" rel="stylesheet">
</head>

<body>

    <div class="container">
        <h1>ছাত্র-ছাত্রীদের বিস্তারিত তথ্য</h1>

        <div class="stats-card">
            <div class="stats-info">
                <div class="stat-item">
                    <span class="dot boy-dot"></span>
                    <p>ছাত্র:</p>
                    <strong id="boy-count-stats">০</strong>
                </div>
                <div class="stat-item">
                    <span class="dot girl-dot"></span>
                    <p>ছাত্রী:</p>
                    <strong id="girl-count-stats">০</strong>
                </div>
                <hr class="stat-divider">
                <div class="stat-item total">
                    <p>মোট:</p>
                    <strong id="total-count-stats">০</strong>
                </div>
            </div>
            <div class="stats-chart">
                <canvas id="genderChart"></canvas>
            </div>
        </div>

        <div class="controls">
            <div class="search-wrapper">
                <input type="text" id="search-box" placeholder="নাম, পিতার নাম, ঠিকানা বা আইডি দিয়ে খুঁজুন..."
                    autocomplete="off">
                <div id="suggestions-box" class="suggestions-list"></div>
            </div>
            <div class="divider"></div>
            <div class="dropdown">
                <select id="class-selector" style="display: none;">
                    <option value="all">সকল ক্লাস</option>
                </select>

                <div class="select" tabindex="0">
                    <span id="selected-display">সকল ক্লাস</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                        <path
                            d="M297.4 438.6C309.9 451.1 330.2 451.1 342.7 438.6L502.7 278.6C515.2 266.1 515.2 245.8 502.7 233.3C490.2 220.8 469.9 220.8 457.4 233.3L320 370.7L182.6 233.4C170.1 220.9 149.8 220.9 137.3 233.4C124.8 245.9 124.8 266.2 137.3 278.7L297.3 438.7z" />
                    </svg>
                </div>
                <ul class="options">
                </ul>
            </div>
        </div>

        <p id="student-count"></p>

        <div id="student-container">
            <p class="loading">তথ্য লোড হচ্ছে...</p>
        </div>
    </div>

    <script src="../js/students-display.js"></script>
</body>

</html>
