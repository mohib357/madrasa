<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষক ম্যানেজমেন্ট প্যানেল</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.maateen.me/hind-siliguri/font.css" rel="stylesheet">

    <link rel="stylesheet" href="teacher-card.css">

    <style>
        /* অ্যাকশন মেনুর ড্রপডাউন দেখানোর জন্য */
        .card-actions .dropdown-content {
            display: none;
        }

        .card-actions:hover .dropdown-content {
            display: block;
            /* হোভার করলে ড্রপডাউন দেখা যাবে */
        }

        /* যদি জাভাস্ক্রিপ্ট দিয়ে টগল করতে চান, তাহলে `.card-actions.active .dropdown-content { display: block; }` ব্যবহার করতে পারেন */
    </style>
</head>

<body class="bg-gray-100>
    <div class=" container mx-auto p-4 sm:p-8">
    <h1 class="text-3xl font-bold mb-6 text-center">শিক্ষক ম্যানেজমেন্ট প্যানেল</h1>
    <div class="flex items-center justify-center gap-6 mb-8 p-4 bg-white rounded-lg shadow-sm">
        <div class="flex items-center">
            <span class="w-5 h-5 block bg-green-500 border-2 border-white rounded-full mr-2 shadow"></span>
            <span class="font-medium text-gray-700">অনুমোদিত (Approved)</span>
        </div>
        <div class="flex items-center">
            <span class="w-5 h-5 block bg-red-500 border-2 border-white rounded-full mr-2 shadow"></span>
            <span class="font-medium text-gray-700">পেন্ডিং (Pending)</span>
        </div>
    </div>

    <div id="teacher-grid-container" class="teacher-grid">
        <p class="text-gray-500 p-4 text-center">তথ্য লোড হচ্ছে...</p>
    </div>
    </div>

    <div id="teacher-details-modal"
        class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-11/12 md:w-1/2 lg:w-1/3 relative">
            <button class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 text-xl"
                id="close-modal">&times;</button>
            <h2 id="modal-teacher-name" class="text-2xl font-bold mb-4"></h2>
            <div id="modal-teacher-details">
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
