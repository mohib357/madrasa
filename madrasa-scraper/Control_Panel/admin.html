<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষক ম্যানেজমেন্ট প্যানেল</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.maateen.me/hind-siliguri/font.css" rel="stylesheet">

    <link rel="stylesheet" href="teacher-card.css">
</head>

<body class="bg-gray-100>
    <div class=" container max-w-7xl mx-auto p-4 sm:p-8">
    <h1 class="text-3xl md:text-4xl font-bold mb-8 text-center text-gray-800">শিক্ষক ম্যানেজমেন্ট প্যানেল</h1>
    <div class="flex items-center justify-center gap-6 mb-8 p-4 bg-white rounded-lg shadow-sm">
        <div class="flex items-center">
            <span class="w-5 h-5 block bg-green-500 border-2 border-white rounded-full mr-2 shadow"></span>
            <span class="font-medium text-gray-700">অনুমোদিত (Approved)</span>
        </div>
        <div class="flex items-center">
            <span class="w-5 h-5 block bg-red-500 border-2 border-white rounded-full mr-2 shadow"></span>
            <span class="font-medium text-gray-700">পেন্ডিং (Pending)</span>
        </div>
    </div>
    <h2 class="text-2xl font-semibold text-gray-700 mb-4 border-b pb-2">বিদ্যমান শিক্ষকদের তালিকা</h2>
    <div id="teacher-grid-container" class="teacher-grid">
        <p class="text-gray-500 p-4 text-center">তথ্য লোড হচ্ছে...</p>
    </div>
    </div>
    <div id="teacher-details-modal"
        class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md relative">
            <button class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 text-2xl"
                id="close-details-modal">&times;</button>
            <h2 id="modal-teacher-name" class="text-2xl font-bold mb-4 border-b pb-2"></h2>
            <div id="modal-teacher-details" class="space-y-2">
            </div>
        </div>
    </div>
    <div id="edit-teacher-modal"
        class="hidden fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-2xl font-bold text-gray-800">শিক্ষকের তথ্য এডিট করুন</h2>
                <button class="text-gray-500 hover:text-gray-800 text-2xl" id="close-edit-modal">&times;</button>
            </div>
            <form id="edit-teacher-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </form>
        </div>
    </div>
    <script src="admin.js"></script>
</body>

</html>
