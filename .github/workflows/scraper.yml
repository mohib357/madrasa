name: Auto Scraper

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: ./madrasa-scraper  # <-- এই লাইনটি যোগ করুন

      - name: Run scraper
        run: node scraper.js
        working-directory: ./madrasa-scraper  # <-- এই লাইনটি যোগ করুন
        env:
          SIKKHALOY_USERNAME: ${{ secrets.SIKKHALOY_USERNAME }}
          SIKKHALOY_PASSWORD: ${{ secrets.SIKKHALOY_PASSWORD }}

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add students.json
          # নিচের লাইনটি চেক করবে কোনো পরিবর্তন আছে কিনা
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update students.json"
            git push
          fi
        working-directory: ./madrasa-scraper